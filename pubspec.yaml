name: sygic_remote_api
description: Flutter plugin wrapping Sygic Professional / Fleet Navigation Stand-alone Android Remote API (IPC) with safe no-op fallbacks on iOS and Web.
version: 0.1.0
homepage: https://github.com/ggabrovski/sygic_remote_api

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.transportorganizer.sygic_remote_api
        pluginClass: SygicRemoteApiPlugin
